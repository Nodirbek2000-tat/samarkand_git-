# Backend: Django API + PostgreSQL.
# Serverda (shu papkada):  docker compose up -d --build
#
# Frontend va bot alohida deploy qilinadi; hammasi umumiy "mentadbirkor" Docker tarmog‘i orqali
# bir-birini nomi bilan topadi (backend:8000, frontend:3000). Bir martalik tayyorlov — DEPLOY.md.

name: mentadbirkor-backend

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentadbirkor}
      POSTGRES_USER: ${POSTGRES_USER:-mentadbirkor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env da POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_MEDIA_ROOT: /data/media
      # Next.js rasm optimizatori /media ni backend orqali o‘qiydi
      DJANGO_SERVE_MEDIA: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      NEXT_REVALIDATE_URL: http://frontend:3000/internal/revalidate
    volumes:
      - media:/data/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/settings', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    logging: *logging

networks:
  default:
    name: mentadbirkor
    external: true

volumes:
  pgdata:
  # frontend dagi nginx ham shu fayllarni beradi
  media:
    name: mentadbirkor_media
    external: true
  static:
    name: mentadbirkor_static
    external: true
